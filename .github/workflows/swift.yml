name: "🐦 Swift Workflow: Build the Swift Package"

# Check the package on pull requests to main and on pushes to main.
# Use the Run workflow button to start a build without making a change.
on:
  push:
    branches: [main, refactor/systemkit-layout]

  pull_request:
    branches: [main]

  workflow_dispatch:

# The job only needs to read the repository to build the package.
permissions:
  contents: read

# Use US English for the command output stored in the build logs.
env:
  LC_ALL: en_US.UTF-8
  SUMMARY_RESULTS: '{"success":"✅ Passed","failure":"❌ Failed","skipped":"⏭️ Skipped","cancelled":"🛑 Canceled"}'

jobs:
  build:
    name: 🏗️ Build with SwiftPM

    # Swift Package Manager uses the Apple tools and SDK on the macOS runner.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: 📋 Show build plan
        id: plan
        run: |
          printf '%s\n' \
            'This job builds the Swift package on macOS.' \
            '1. Check out the source code.' \
            '2. Check the Xcode and Swift versions.' \
            '3. Build the package with Swift Package Manager and record the full output.' \
            '4. Build and run a small program that uses both package libraries.' \
            '5. Upload the logs and write a summary of the step results.'

      - name: 📥 Check out source
        id: checkout
        uses: actions/checkout@v6

      # Record the tools used in this run to help explain changes in build results.
      - name: 🔍 Check Xcode and Swift versions
        id: toolchain
        run: |
          bash .github/scripts/log-ci-step.sh "Check Xcode and Swift versions" toolchain.log \
            bash -ec 'uname -sm; xcodebuild -version; swift --version'

      # Check the command line build on macOS with Swift Package Manager.
      # The helper saves the detailed output and returns a failure if the build fails.
      - name: 🔨 Build Swift package
        id: build
        run: |
          bash .github/scripts/log-ci-step.sh "Build Swift package" swift-build.log swift build -v

      # Build and run a separate package in release mode to check that users can
      # import and link both library products from outside this repository.
      - name: 🧪 Test Swift package as a dependency
        id: smoke_test
        run: |
          bash .github/scripts/log-ci-step.sh "Test Swift package as a dependency" swift-consumer.log \
            bash .github/scripts/smoke-test-swift-package.sh

      - name: Test AES migration
        run: swift test --filter SecurityMigrationTests

      # Keep the tool and build logs available when a step fails after checkout.
      - name: 📦 Upload build logs
        id: logs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: swift-build-logs
          path: ${{ runner.temp }}/systemkit-logs/
          if-no-files-found: error

      # Show which steps passed, failed, or were skipped in the run summary.
      - name: 📝 Write build summary
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## 🐦 Swift package build

          **Job result** ${{ fromJSON(env.SUMMARY_RESULTS)[job.status] }}

          | Step | Result |
          | --- | --- |
          | Show build plan | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.plan.outcome || 'skipped'] }} |
          | Check out source | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.checkout.outcome || 'skipped'] }} |
          | Check Xcode and Swift versions | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.toolchain.outcome || 'skipped'] }} |
          | Build Swift package | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.build.outcome || 'skipped'] }} |
          | Test Swift package as a dependency | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.smoke_test.outcome || 'skipped'] }} |
          | Upload build logs | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.logs.outcome || 'skipped'] }} |

          ${{ steps.logs.outputs.artifact-url && format('📦 [Download build logs]({0})', steps.logs.outputs.artifact-url) || '📦 No artifact was uploaded.' }}
          SUMMARY
