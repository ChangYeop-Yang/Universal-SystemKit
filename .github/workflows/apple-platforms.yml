name: Apple Platform Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            destination: generic/platform=macOS
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: visionOS
            destination: generic/platform=visionOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: watchOS
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v6
      - name: Build Swift and Objective-C libraries
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          xcodebuild -version
          for scheme in SystemKit SystemKit_Objc; do
            log="$RUNNER_TEMP/$scheme.log"
            if ! xcodebuild build -scheme "$scheme" -destination "$DESTINATION" \
              -derivedDataPath "$RUNNER_TEMP/Universal-SystemKit" CODE_SIGNING_ALLOWED=NO > "$log" 2>&1; then
              cat "$log"
              error=$(awk '/[Ee]rror:/{print; exit}' "$log")
              error=${error//%/%25}
              echo "::error::${scheme}: ${error:-xcodebuild failed. See the job log.}"
              exit 1
            fi
            cat "$log"
          done
