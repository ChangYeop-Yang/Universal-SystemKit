name: 🍎 Apple Platform Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8

jobs:
  build:
    name: 🏗️ Build for ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            destination: generic/platform=macOS
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: visionOS
            destination: generic/platform=visionOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: watchOS
            destination: generic/platform=watchOS Simulator
    steps:
      - name: 📥 Check out source
        id: checkout
        uses: actions/checkout@v6
      - name: 🔍 Check Xcode and installed SDKs
        id: toolchain
        run: |
          bash .github/scripts/log-ci-step.sh "Check Xcode and installed SDKs" toolchain.log \
            bash -ec 'uname -sm; xcodebuild -version; swift --version; xcodebuild -showsdks'
      - name: 🐦 Build SystemKit
        id: swift_build
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          bash .github/scripts/log-ci-step.sh "Build SystemKit" SystemKit.log \
            xcodebuild build -scheme SystemKit -destination "$DESTINATION" \
              -derivedDataPath "$RUNNER_TEMP/Universal-SystemKit" CODE_SIGNING_ALLOWED=NO
      - name: 🧱 Build SystemKit_Objc
        id: objc_build
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          bash .github/scripts/log-ci-step.sh "Build SystemKit_Objc" SystemKit_Objc.log \
            xcodebuild build -scheme SystemKit_Objc -destination "$DESTINATION" \
              -derivedDataPath "$RUNNER_TEMP/Universal-SystemKit" CODE_SIGNING_ALLOWED=NO
      - name: 📦 Upload build logs
        id: logs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-build-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/systemkit-logs/
          if-no-files-found: error
      - name: 📝 Write build summary
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## ${{ matrix.platform }} build results

          Destination: `${{ matrix.destination }}`

          | Step | Result |
          | --- | --- |
          | Check out source | ${{ steps.checkout.outcome }} |
          | Check Xcode and installed SDKs | ${{ steps.toolchain.outcome }} |
          | Build SystemKit | ${{ steps.swift_build.outcome }} |
          | Build SystemKit_Objc | ${{ steps.objc_build.outcome }} |
          | Upload build logs | ${{ steps.logs.outcome }} |
          SUMMARY
