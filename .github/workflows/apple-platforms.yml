name: "🍎 Apple Platform Builds Workflow: Build for Apple Platforms"

# Build pull requests that target main and run the same checks on pushes to main.
# Use the Run workflow button to repeat the builds on demand.

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

# The jobs only need to read the repository to build the package.

permissions:
  contents: read

# Use US English so the build messages are easy to compare across platforms.

env:
  LC_ALL: en_US.UTF-8
  SUMMARY_RESULTS: '{"success":"✅ Passed","failure":"❌ Failed","skipped":"⏭️ Skipped","cancelled":"🛑 Canceled"}'

jobs:
  build:
    name: 🏗️ Build for ${{ matrix.platform }}

    # Use the default Xcode and platform SDKs on the hosted macOS runner.

    runs-on: macos-26
    timeout-minutes: 25

    strategy:
      # Let the other platform builds finish when one platform fails.

      fail-fast: false
      matrix:
        # Run one job per platform. Generic simulator destinations avoid
        # depending on a specific device model or starting a simulator.

        include:
          - platform: macOS
            destination: generic/platform=macOS
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: visionOS
            destination: generic/platform=visionOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: watchOS
            destination: generic/platform=watchOS Simulator

    steps:
      - name: 📋 Show build plan
        id: plan
        env:
          PLATFORM: ${{ matrix.platform }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          printf 'This job builds the libraries for %s.\n' "$PLATFORM"
          printf 'Build destination: %s\n' "$DESTINATION"
          printf '%s\n' \
            '1. Check out the source code.' \
            '2. Check the Xcode and Swift versions and list the installed SDKs.' \
            '3. Build SystemKit and SystemKit_Objc in separate steps.' \
            '4. Upload the build logs and write a summary of the step results.'

      - name: 📥 Check out source
        id: checkout
        uses: actions/checkout@v6

      # Record the runner, tool versions, and SDKs to help trace build changes.

      - name: 🔍 Check Xcode and installed SDKs
        id: toolchain
        run: |
          bash .github/scripts/log-ci-step.sh "Check Xcode and installed SDKs" toolchain.log \
            bash -ec 'uname -sm; xcodebuild -version; swift --version; xcodebuild -showsdks'

      # Build each library in its own step so the summary identifies which one failed.
      # Code signing is off because these are build checks for macOS and simulators.

      - name: 🐦 Build SystemKit
        id: swift_build
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          bash .github/scripts/log-ci-step.sh "Build SystemKit" SystemKit.log \
            xcodebuild build -scheme SystemKit -destination "$DESTINATION" \
              -derivedDataPath "$RUNNER_TEMP/Universal-SystemKit" CODE_SIGNING_ALLOWED=NO

      # Try the second library even if the Swift build fails, as long as the
      # tools are ready and the job has not been canceled.

      - name: 🧱 Build SystemKit_Objc
        id: objc_build
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          bash .github/scripts/log-ci-step.sh "Build SystemKit_Objc" SystemKit_Objc.log \
            xcodebuild build -scheme SystemKit_Objc -destination "$DESTINATION" \
              -derivedDataPath "$RUNNER_TEMP/Universal-SystemKit" CODE_SIGNING_ALLOWED=NO

      # Save logs even after a build failure. Use a different name for each
      # platform so jobs in the same run do not share an artifact name.

      - name: 📦 Upload build logs
        id: logs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-build-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/systemkit-logs/
          if-no-files-found: error

      # Show the status of each step, including failures and skipped steps.

      - name: 📝 Write build summary
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## 🍎 ${{ matrix.platform }} build

          **Job result** ${{ fromJSON(env.SUMMARY_RESULTS)[job.status] }}

          **Destination** `${{ matrix.destination }}`

          | Step | Result |
          | --- | --- |
          | Show build plan | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.plan.outcome || 'skipped'] }} |
          | Check out source | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.checkout.outcome || 'skipped'] }} |
          | Check Xcode and installed SDKs | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.toolchain.outcome || 'skipped'] }} |
          | Build SystemKit | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.swift_build.outcome || 'skipped'] }} |
          | Build SystemKit_Objc | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.objc_build.outcome || 'skipped'] }} |
          | Upload build logs | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.logs.outcome || 'skipped'] }} |

          ${{ steps.logs.outputs.artifact-url && format('📦 [Download build logs]({0})', steps.logs.outputs.artifact-url) || '📦 No artifact was uploaded.' }}
          SUMMARY
