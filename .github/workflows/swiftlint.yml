name: "🧹 SwiftLint Workflow: Check Swift Code Style"

# Review style in pull requests to main and check the code after it reaches main.
# Use the Run workflow button to check the code again without a new commit.
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

# The job reads the repository and reports style findings in GitHub Actions.
permissions:
  contents: read

# Use US English for the command output stored in the lint logs.
env:
  LC_ALL: en_US.UTF-8
  SWIFTLINT_VERSION: '0.65.1'
  SUMMARY_RESULTS: '{"success":"✅ Passed","failure":"❌ Failed","skipped":"⏭️ Skipped","cancelled":"🛑 Canceled"}'

jobs:
  lint:
    name: 🔎 Check Swift source

    # Use the Apple toolchain on the hosted macOS runner.
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: 📋 Show lint plan
        id: plan
        run: |
          printf '%s\n' \
            'This job checks the style of the Swift source code.' \
            '1. Check out the source code.' \
            "2. Install SwiftLint $SWIFTLINT_VERSION and print its version." \
            '3. Check Swift files using the repository lint policy.' \
            '4. Upload the lint logs and write a summary of the step results.'

      - name: 📥 Check out source
        id: checkout
        uses: actions/checkout@v6

      # Download the exact SwiftLint release used by contributors.
      - name: 📦 Install SwiftLint
        id: install
        run: |
          bash .github/scripts/log-ci-step.sh "Install SwiftLint" swiftlint-install.log \
            bash -ec '
              lint_dir="$RUNNER_TEMP/swiftlint"
              mkdir -p "$lint_dir"
              curl --fail --location --silent --show-error \
                "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
                --output "$lint_dir/portable_swiftlint.zip"
              unzip -oq "$lint_dir/portable_swiftlint.zip" -d "$lint_dir"
              "$lint_dir/swiftlint" version
              printf "%s\n" "$lint_dir" >> "$GITHUB_PATH"
            '

      # Use the root policy for file discovery, rules, and severity.
      # The GitHub Actions reporter adds file names and line numbers.
      - name: 🧹 Run SwiftLint
        id: lint
        run: |
          bash .github/scripts/log-ci-step.sh "Run SwiftLint" swiftlint.log \
            swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      # Save both logs when available, even if installation or linting fails.
      - name: 📦 Upload lint logs
        id: logs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint-logs
          path: ${{ runner.temp }}/systemkit-logs/
          if-no-files-found: error

      # Report installation and linting separately so a skipped check is visible.
      - name: 📝 Write lint summary
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## 🧹 SwiftLint

          **Job result** ${{ fromJSON(env.SUMMARY_RESULTS)[job.status] }}

          | Step | Result |
          | --- | --- |
          | Show lint plan | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.plan.outcome || 'skipped'] }} |
          | Check out source | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.checkout.outcome || 'skipped'] }} |
          | Install SwiftLint | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.install.outcome || 'skipped'] }} |
          | Run SwiftLint | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.lint.outcome || 'skipped'] }} |
          | Upload lint logs | ${{ fromJSON(env.SUMMARY_RESULTS)[steps.logs.outcome || 'skipped'] }} |

          ℹ️ SwiftLint reports style issues as warnings with file names and line numbers.

          ${{ steps.logs.outputs.artifact-url && format('📦 [Download lint logs]({0})', steps.logs.outputs.artifact-url) || '📦 No artifact was uploaded.' }}
          SUMMARY
